<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2300b050'/%3E%3Cpath d='M20 15h14c9 0 14 5 14 12s-5 12-14 12h-6v10h-8V15zm8 7v10h6c4 0 6-2 6-5s-2-5-6-5h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-page">
  <header class="panel-header">
    <a class="logo" href="index.html">INTELLI<span>PARK</span></a>
    <div class="panel-header-actions">
      <a class="btn btn-outline" href="index.html">Home</a>
      <a class="btn btn-outline" href="admin-revenue.html">Revenue</a>
      <a class="btn btn-outline" href="admin-users.html">Users</a>
      <a id="adminNotificationsBtn" class="btn btn-outline notifications-link" href="admin-notifications.html">
        Notifications
        <span id="adminNotificationsBadge" class="notifications-badge hidden">0</span>
      </a>
      <button id="adminLogoutBtn" class="btn btn-outline" type="button">Logout</button>
    </div>
  </header>

  <main class="panel-wrap">
    <section class="panel-card">
      <h1>Admin Module</h1>
      <p id="adminSummary" class="form-msg"></p>
      <h2>Place-wise Slot Status</h2>
      <div id="adminPlaceStats" class="place-grid"></div>
    </section>

    <section class="panel-card">
      <h2>Manage Place Slots</h2>
      <form id="placeSlotsForm" class="form-grid">
        <label>
          Place Name
          <select id="adminPlaceSelect" required>
            <option value="Goregaon">Goregaon</option>
          </select>
        </label>
        <label>
          Total Slots For Place
          <input id="adminPlaceSlotCount" type="number" min="0" required>
        </label>
        <label>
          Booking Amount (Rs)
          <input id="adminPlaceRate" type="number" min="0" step="1" required>
        </label>
        <button type="submit" class="btn btn-primary">Update Place Slots</button>
      </form>
      <p id="adminMsg" class="form-msg"></p>
    </section>

    <section class="panel-card">
      <h2>Book Slot For Any User</h2>
      <form id="adminBookingForm" class="form-grid">
        <label>
          User Gmail
          <input id="adminUserEmail" type="email" placeholder="user@gmail.com" required>
        </label>
        <label>
          Vehicle Number
          <input id="adminVehicleNumber" type="text" placeholder="MH12AB1234" required>
        </label>
        <label>
          Place Name
          <select id="adminBookingPlace" required>
            <option value="Goregaon">Goregaon</option>
          </select>
        </label>
        <label>
          From Date
          <input id="adminFromDate" type="date" required>
        </label>
        <label>
          From Time
          <input id="adminFromTime" type="time" required>
        </label>
        <label>
          To Date
          <input id="adminToDate" type="date" required>
        </label>
        <label>
          To Time
          <input id="adminToTime" type="time" required>
        </label>
        <label>
          Payment Method
          <select id="adminPaymentMethod" required>
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Book Slot</button>
      </form>
      <p id="adminBookingMsg" class="form-msg"></p>
    </section>

    <section class="panel-card">
      <h2>All Active Bookings (Admin Can Cancel)</h2>
      <div id="adminBookings" class="list-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
